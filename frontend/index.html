<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>AI Assistant</h1>
            <p>Your Leisure Planning Companion</p>
        </header>

        <main>
            <div class="assistant-visualizer" id="visualizer">
                <div class="orb"></div>
            </div>

            <div class="status-text" id="status-text">Click the microphone to start</div>

            <button class="mic-btn" id="mic-btn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C10.3431 2 9 3.34315 9 5V11C9 12.6569 10.3431 14 12 14C13.6569 14 15 12.6569 15 11V5C15 3.34315 13.6569 2 12 2Z" fill="currentColor"/>
                    <path d="M19 10V11C19 14.866 15.866 18 12 18C8.13401 18 5 14.866 5 11V10H3V11C3 15.5393 6.36214 19.2907 10.7456 19.9079C10.9126 19.932 11 20.0763 11 20.2456V22H13V20.2456C13 20.0763 13.0874 19.932 13.2544 19.9079C17.6379 19.2907 21 15.5393 21 11V10H19Z" fill="currentColor"/>
                </svg>
            </button>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
