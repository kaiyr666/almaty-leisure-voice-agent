<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almaty Leisure Voice Assistant</title>
    <!-- Modern Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="logo-area">
                <span class="logo-dot"></span>
                <h1>Almaty Leisure</h1>
            </div>
            <p class="subtitle">Your intelligent guide to events in the city</p>
        </header>

        <main>
            <!-- Glow orb visualizer indicating voice assistant state -->
            <div class="visualizer-container">
                <div class="orb-outer">
                    <div class="orb-glow"></div>
                    <div class="orb" id="orb">
                        <div class="orb-wave wave1"></div>
                        <div class="orb-wave wave2"></div>
                        <div class="orb-wave wave3"></div>
                    </div>
                </div>
            </div>

            <!-- Dynamic state / response text block -->
            <div class="status-panel">
                <div class="status-indicator">
                    <span class="status-pulse" id="status-pulse"></span>
                    <span class="status-text" id="status-text">Connecting...</span>
                </div>
                <div class="transcript-box" id="transcript-box">
                    <p class="system-msg">Ready. Press the microphone button below to start.</p>
                </div>
            </div>

            <!-- Big tactile interactive microphone button -->
            <div class="controls">
                <button class="mic-button" id="mic-btn" disabled>
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z" fill="currentColor"/>
                        <path d="M19 10v1a7 7 0 0 1-14 0v-1H3v1a9 9 0 0 0 8 8.94V21H9v2h6v-2h-2v-1.06A9 9 0 0 0 21 11v-1h-2z" fill="currentColor"/>
                    </svg>
                    <span class="ripple"></span>
                </button>
            </div>
        </main>

        <footer>
            <p>Powered by Groq Whisper, Llama 3 & OpenAI TTS</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
